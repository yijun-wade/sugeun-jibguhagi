name: Daily Real Estate Briefing

on:
  schedule:
    - cron: '0 22 * * *'  # 매일 오전 7시 KST (22:00 UTC)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/generate-briefing.mjs

      - name: Generate blog post draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-blog-post.mjs

      # 8시간 간격 하루 2편이므로 브리핑 1편 + 카테고리 1편.
      # 카테고리는 5종을 돌려가며 쓰고, 소재 풀은 1,100건이 넘어 3년치가 있다.
      - name: Generate category draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-category-posts.mjs --count=1

      - name: Collect new policies
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/collect-policies.mjs
        continue-on-error: true

      - name: Track index and rank
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/check-index.mjs
        continue-on-error: true

      - name: Build Naver paste pack
        run: node scripts/build-naver-pack.mjs

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Regenerate RSS
        run: node scripts/generate-rss.mjs

      - name: Commit if new briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/briefings/ public/policies-auto.json public/sitemap.xml public/rss.xml public/naver-pack.html blog-posts/ published/
          git diff --cached --quiet || git commit -m "chore: daily briefing $(date -u +'%Y-%m-%d')"
          git push
