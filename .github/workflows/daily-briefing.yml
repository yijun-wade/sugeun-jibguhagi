name: Daily Real Estate Briefing

on:
  schedule:
    - cron: '0 22 * * *'  # 매일 오전 7시 KST (22:00 UTC)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/generate-briefing.mjs

      # 2026-11-02 제거: 블로그 초안(generate-blog-post.mjs)과
      # 카테고리 초안(generate-category-posts.mjs --count=1).
      #
      # 네이버 블로그 채널은 8주/24편에 유입 0명으로 기각됐고(utm·리퍼러 모두 0),
      # 발행을 돌리던 launchd(kr.suzip.publish)는 세션 만료로 9/9 이후 0편이면서
      # 매일 2회 실패만 반복하다 오늘 정지됐다. 밀린 초안 20편.
      # 즉 읽는 사람 없는 글에 매일 API를 두 번 쓰고 있었다.
      #
      # 되돌리기: 이 커밋 revert + 네이버 세션 1회 수동 로그인.

      - name: Collect new policies
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/collect-policies.mjs
        continue-on-error: true

      - name: Track index and rank
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/check-index.mjs
        continue-on-error: true

      - name: Build Naver paste pack
        run: node scripts/build-naver-pack.mjs

      - name: Regenerate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Regenerate RSS
        run: node scripts/generate-rss.mjs

      - name: Commit if new briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/briefings/ public/policies-auto.json public/sitemap.xml public/rss.xml public/naver-pack.html blog-posts/ published/
          git diff --cached --quiet || git commit -m "chore: daily briefing $(date -u +'%Y-%m-%d')"
          git push
